[package]
name = "tubedirector-engine"
version = "0.2.0"
description = "TubeDirector Engine"
authors = ["TubeDirector"]
edition = "2021"

[lib]
name = "tubedirector_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
