name: Publicar TubeDirector Engine para Windows

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Compilar e publicar instalador Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Restaurar fonte original do motor
        run: python scripts/restore-bridge.py
      - name: Validar motor e interface
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py src-tauri/resources/bridge.py
          node --check src/main.js
      - name: Preparar ícones
        run: |
          python -m pip install "Pillow>=11,<13"
          python scripts/generate-icons.py
      - name: Empacotar motor local Piper
        run: python scripts/build-sidecar.py
      - name: Instalar dependências de interface
        run: npm install
      - name: Compilar instalador NSIS
        run: npm run build -- --bundles nsis
      - name: Preparar download direto
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "engine/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Instalador nao encontrado" }
          Copy-Item $installer.FullName "TubeDirector-Engine-Setup.exe"
          Write-Host "Instalador publicado: $($installer.Length) bytes"
        working-directory: .
      - name: Publicar release oficial
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: .
        run: |
          gh release view v0.3.0 >/dev/null 2>&1 || gh release create v0.3.0 --title "TubeDirector Engine 0.3.0 - Windows" --notes "Instalador Windows x64: narração local sem tickets por áudio. O acesso Pro/Max continua controlado pelo site. Aplicativo não assinado digitalmente."
          gh release upload v0.3.0 TubeDirector-Engine-Setup.exe --clobber
      - name: Guardar cópia de recuperação
        uses: actions/upload-artifact@v4
        with:
          name: TubeDirector-Engine-Windows
          path: TubeDirector-Engine-Setup.exe
          retention-days: 30
          if-no-files-found: error
